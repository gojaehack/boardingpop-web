<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7B4BC9">
  <title>Boarding Pop</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #7B4BC9; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #7B4BC9; }
    #unity-loading-bar { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 70%; max-width: 360px; text-align: center; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #unity-loading-title { font-size: 22px; font-weight: 700; margin-bottom: 14px; letter-spacing: 1px; }
    #unity-progress-bar-empty { width: 100%; height: 14px; background: rgba(255,255,255,0.25); border-radius: 7px; overflow: hidden; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: #FFC436; border-radius: 7px; transition: width 0.15s; }
    #unity-warning { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: sans-serif; display: none; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-loading-title">Boarding Pop</div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      warningBanner.innerHTML = msg;
      warningBanner.style.display = "block";
      if (type === "error") warningBanner.style.background = "rgba(200,0,0,0.8)";
      setTimeout(function () { warningBanner.style.display = "none"; }, type === "error" ? 15000 : 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "rnmsoft",
      productName: "Boarding Pop",
      productVersion: "1.0.0",
      showBanner: unityShowBanner,
      // Mobile browsers: cap the backing resolution so the GPU keeps up.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    // Fill the whole viewport, portrait or landscape; Unity scales the game inside.
    function resizeCanvas() {
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", function () { setTimeout(resizeCanvas, 100); });
    resizeCanvas();

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
